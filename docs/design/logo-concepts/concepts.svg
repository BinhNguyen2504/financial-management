<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1160" viewBox="0 0 1800 1160" role="img" aria-labelledby="overview-title"><title id="overview-title">Ba phương án biểu tượng: Hũ mở, Gom và Cân bằng</title><g font-family="Arial, Helvetica, sans-serif" fill="#292724"><rect width="1800" height="1160" fill="#FAFAF8"/><text x="64" y="56" font-size="17" letter-spacing="2">FINANCIAL MANAGER / NGHIÊN CỨU BIỂU TƯỢNG</text><text x="1736" y="56" font-size="17" text-anchor="end">29.10.2026 · 02</text><text x="64" y="133" font-size="58" font-weight="600">Ba hướng logo.</text><text x="64" y="176" font-size="23" fill="#65615B">Bình tĩnh. Rõ ràng. Tích lũy từng ngày.</text><path d="M64 210H1736" stroke="#D9D5CD"/><path d="M612 242V854M1188 242V854" stroke="#D9D5CD"/><text x="64" y="264" font-size="20" fill="#65615B">A</text><svg x="160" y="290" width="320" height="320" viewBox="0 0 256 256" aria-label="a-"><path fill="#000000" d="M64 40H116V68H104V92C80 108 68 128 68 152C68 178 86 188 128 188C170 188 188 178 188 152C188 128 176 108 152 92V40H192V68H180V80C204 100 216 124 216 152C216 196 184 216 128 216C72 216 40 196 40 152C40 124 52 100 76 80V68H64Z"/></svg><text x="64" y="654" font-size="35" font-weight="600">Hũ mở</text><text x="64" y="697" font-size="22" fill="#65615B">Một khoảng mở để đón thêm.</text><text x="64" y="727" font-size="22" fill="#65615B">Một thân hũ vững để giữ lại.</text><svg x="64" y="750" width="64" height="64" viewBox="0 0 256 256" aria-label="a-"><path fill="#000000" d="M64 40H116V68H104V92C80 108 68 128 68 152C68 178 86 188 128 188C170 188 188 178 188 152C188 128 176 108 152 92V40H192V68H180V80C204 100 216 124 216 152C216 196 184 216 128 216C72 216 40 196 40 152C40 124 52 100 76 80V68H64Z"/></svg><text x="96" y="840" font-size="15" text-anchor="middle" fill="#65615B">64 px</text><svg x="168" y="782" width="32" height="32" viewBox="0 0 256 256" aria-label="a-"><path fill="#000000" d="M64 40H116V68H104V92C80 108 68 128 68 152C68 178 86 188 128 188C1